[build-system]
requires = ["setuptools>=77", "wheel>=0.36"]
build-backend = "setuptools.build_meta"

[project]
name = "apolo-flow"
dynamic = ["version"]
description = "Pipelines system for Apolo MLOps platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Apolo Team", email = "dev@apolo.us"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "apolo-cli>=26.11.0",
    "pyyaml>=5.4",
    "funcparserlib>=1.0.0",
    "humanize>=4.10",
    "apolo-extras>=25.9.0",
    "graphviz>=0.20.3",
    "yarl>=1.13",
    "multidict>=5.0,<7.0",
    "rich>=13.7.0",
    "typing-extensions>=3.10",
    "click>=8.4",
]

[project.urls]
Homepage = "https://github.com/neuro-inc/neuro-flow"

[project.scripts]
apolo-flow = "apolo_flow.cli:main"
neuro-flow = "apolo_flow.cli:main"

[project.entry-points.apolo_api]
apolo-cli = "apolo_flow.plugin:setup"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "apolo_flow.__version__"}

[tool.poetry]
package-mode = false
requires-poetry = "==2.5.1"

[tool.poetry.group.dev.dependencies]
cookiecutter = "==2.7.1"
jsonschema = "==4.26.0"
pre-commit = "==4.6.1"
pytest = "==9.1.1"
pytest-aiohttp = "==1.1.1"
pytest-asyncio = "==1.4.0"
pytest-xdist = "==3.8.0"
re-assert = "==1.1.0"
towncrier = "==25.8.0"
mypy = "==2.3.0"
types-jsonschema = "==4.26.0.20260518"
types-python-dateutil = "==2.9.0.20260716"
types-PyYAML = "==6.0.12.20260724"
trafaret = "==2.1.1"
build = ">=1.2"
twine = ">=6"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "funcparserlib.*",
    "graphviz",
    "humanize",
    "pytest",
    "apolo_extras",
    "re_assert",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F541"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["aiohttp", "async_timeout", "pytest"]
